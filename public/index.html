<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarksville Grocery Compare</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Clarksville Grocery Compare</h1>
  <nav>
    <button data-tab="search" class="active">Search</button>
    <button data-tab="list">Shopping List</button>
    <button data-tab="add">Add Price</button>
    <button data-tab="stores">Stores</button>
  </nav>
</header>
<main>
  <section id="tab-search" class="tab active">
    <div class="row">
      <input id="q" placeholder="Search an item, e.g. eggs, milk, chicken breast">
      <label class="chk"><input type="checkbox" id="salesOnly"> Sales only</label>
      <button id="krogerBtn" title="Live Kroger prices (needs server + API key)">Live Kroger</button>
    </div>
    <div id="results"></div>
  </section>

  <section id="tab-list" class="tab">
    <div class="row">
      <input id="listItem" placeholder="Add item to list (matches your saved prices)">
      <button id="listAdd">Add</button>
      <button id="listClear" class="ghost">Clear</button>
    </div>
    <ul id="listItems"></ul>
    <div id="plan"></div>
  </section>

  <section id="tab-add" class="tab">
    <form id="priceForm" class="grid">
      <label>Item <input name="item" required placeholder="Large eggs"></label>
      <label>Brand <input name="brand" placeholder="Store brand"></label>
      <label>Store <select name="store" id="storeSelect"></select></label>
      <label>Price ($) <input name="price" type="number" step="0.01" min="0" required></label>
      <label>Size <input name="size" type="number" step="0.01" min="0" placeholder="12"></label>
      <label>Unit <select name="unit">
        <option>ct</option><option>oz</option><option>lb</option><option>fl oz</option><option>gal</option><option>each</option>
      </select></label>
      <label class="chk"><input type="checkbox" name="sale"> On sale</label>
      <label>Sale ends <input name="saleEnds" type="date"></label>
      <label class="wide">Notes <input name="notes" placeholder="BOGO, digital coupon, etc."></label>
      <button type="submit" class="wide">Save price</button>
    </form>
    <div class="row">
      <button id="exportBtn" class="ghost">Export data</button>
      <label class="ghost filebtn">Import data <input type="file" id="importFile" accept="application/json" hidden></label>
    </div>
  </section>

  <section id="tab-stores" class="tab">
    <p class="muted">Turn off stores you don't shop at. Links go to each store's weekly ad.</p>
    <ul id="storeList"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
